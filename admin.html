<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GestoPro — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --border: #1e1e2e;
    --accent: #6ee7b7;
    --accent2: #818cf8;
    --danger: #f87171;
    --text: #e2e8f0;
    --muted: #64748b;
    --card: #0f0f18;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
  }

  /* ── LOGIN ── */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 60% 40%, #0d2a1f 0%, var(--bg) 60%);
  }

  .login-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 48px 40px;
    width: 380px;
    position: relative;
    overflow: hidden;
  }

  .login-box::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }

  .login-logo {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -1px;
    margin-bottom: 6px;
  }

  .login-sub {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 36px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .login-box label {
    display: block;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .login-box input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
    margin-bottom: 24px;
  }

  .login-box input:focus {
    border-color: var(--accent);
  }

  .btn-login {
    width: 100%;
    background: var(--accent);
    color: #0a0a0f;
    border: none;
    border-radius: 8px;
    padding: 13px;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 1px;
    cursor: pointer;
    transition: opacity .2s, transform .1s;
  }

  .btn-login:hover { opacity: .9; transform: translateY(-1px); }
  .btn-login:active { transform: translateY(0); }

  .login-error {
    color: var(--danger);
    font-size: 12px;
    margin-top: 12px;
    text-align: center;
    display: none;
  }

  /* ── DASHBOARD ── */
  #dashboard { display: none; }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .header-logo {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -0.5px;
  }

  .header-badge {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-left: 10px;
  }

  .btn-logout {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: 6px 14px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all .2s;
  }

  .btn-logout:hover { border-color: var(--danger); color: var(--danger); }

  main {
    padding: 40px 32px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 40px;
  }

  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  .stat-card::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, var(--accent), transparent);
    opacity: .4;
  }

  .stat-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .stat-value {
    font-family: 'Syne', sans-serif;
    font-size: 36px;
    font-weight: 800;
    color: var(--accent);
    line-height: 1;
  }

  .section-title {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .section-title span {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 400;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .search-bar {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    outline: none;
    width: 280px;
    margin-bottom: 20px;
    transition: border-color .2s;
  }

  .search-bar:focus { border-color: var(--accent2); }
  .search-bar::placeholder { color: var(--muted); }

  .table-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  th {
    padding: 14px 20px;
    text-align: left;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
  }

  td {
    padding: 16px 20px;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }

  tr:last-child td { border-bottom: none; }

  tr:hover td { background: rgba(110,231,183,.03); }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 500;
  }

  .badge-active { background: rgba(110,231,183,.1); color: var(--accent); }
  .badge-trial  { background: rgba(129,140,248,.1); color: var(--accent2); }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--bg);
    margin-right: 10px;
    vertical-align: middle;
    flex-shrink: 0;
  }

  .name-cell { display: flex; align-items: center; }

  .loading {
    text-align: center;
    padding: 60px;
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 1px;
  }

  .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 8px;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .3; }
  }

  .empty {
    text-align: center;
    padding: 60px;
    color: var(--muted);
  }

  .refresh-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--accent);
    border-radius: 6px;
    padding: 8px 16px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all .2s;
    margin-bottom: 20px;
    margin-left: 12px;
  }

  .refresh-btn:hover { background: rgba(110,231,183,.05); }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">GestoPro</div>
    <div class="login-sub">Panel de Administración</div>
    <label>Contraseña</label>
    <input type="password" id="pwd-input" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()">
    <button class="btn-login" onclick="login()">INGRESAR</button>
    <div class="login-error" id="login-error">Contraseña incorrecta</div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <header>
    <div>
      <span class="header-logo">GestoPro</span>
      <span class="header-badge">// admin</span>
    </div>
    <button class="btn-logout" onclick="logout()">SALIR</button>
  </header>

  <main>
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Total clientes</div>
        <div class="stat-value" id="stat-total">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Este mes</div>
        <div class="stat-value" id="stat-mes">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Último registro</div>
        <div class="stat-value" style="font-size:18px;padding-top:6px" id="stat-ultimo">—</div>
      </div>
    </div>

    <div class="section-title">
      Clientes registrados <span>auth.users</span>
    </div>

    <div style="display:flex;align-items:center">
      <input class="search-bar" type="text" id="search" placeholder="Buscar por nombre o email..." oninput="filterTable()">
      <button class="refresh-btn" onclick="loadClients()">↻ ACTUALIZAR</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Cliente</th>
            <th>Email</th>
            <th>Teléfono</th>
            <th>Empresa</th>
            <th>Registro</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr><td colspan="6" class="loading"><span class="dot"></span>Cargando clientes...</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script>
  // ── CONFIGURACIÓN ──
  const SUPABASE_URL = 'https://hnaewjnvxlvywnihxkgv.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhuYWV3am52eGx2eXduaWh4a2d2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NzI0MzUsImV4cCI6MjA5NjI0ODQzNX0.wKsLZopVVAhDV_4RUaLU8Lx8LnorfmE9BGScYWlrW7g';
  const ADMIN_PASSWORD = 'rovi2025';            // ← podés cambiarla

  let allClients = [];

  function login() {
    const pwd = document.getElementById('pwd-input').value;
    if (pwd === ADMIN_PASSWORD) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadClients();
    } else {
      document.getElementById('login-error').style.display = 'block';
    }
  }

  function logout() {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('pwd-input').value = '';
  }

  async function loadClients() {
    document.getElementById('table-body').innerHTML =
      '<tr><td colspan="6" class="loading"><span class="dot"></span>Cargando...</td></tr>';

    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/negocios?select=*&order=created_at.desc`, {
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        }
      });

      allClients = await res.json();
      renderTable(allClients);
      updateStats(allClients);
    } catch(e) {
      document.getElementById('table-body').innerHTML =
        '<tr><td colspan="6" class="empty">Error al cargar datos. Verificá la API key.</td></tr>';
    }
  }

  function updateStats(clients) {
    document.getElementById('stat-total').textContent = clients.length;

    const now = new Date();
    const thisMonth = clients.filter(c => {
      const d = new Date(c.created_at);
      return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    });
    document.getElementById('stat-mes').textContent = thisMonth.length;

    if (clients.length > 0) {
      const last = new Date(clients[0].created_at);
      document.getElementById('stat-ultimo').textContent =
        last.toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit' });
    }
  }

  function renderTable(clients) {
    const tbody = document.getElementById('table-body');
    if (!clients.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty">No hay clientes registrados aún.</td></tr>';
      return;
    }

    tbody.innerHTML = clients.map(c => {
      const nombre = c.nombre || c.name || c.razon_social || '—';
      const email  = c.email || '—';
      const tel    = c.telefono || c.phone || '—';
      const empresa = c.empresa || c.nombre_negocio || '—';
      const fecha  = c.created_at
        ? new Date(c.created_at).toLocaleDateString('es-AR', {day:'2-digit',month:'2-digit',year:'numeric'})
        : '—';
      const inicial = nombre !== '—' ? nombre[0].toUpperCase() : '?';

      return `
        <tr>
          <td><div class="name-cell"><div class="avatar">${inicial}</div>${nombre}</div></td>
          <td>${email}</td>
          <td>${tel}</td>
          <td>${empresa}</td>
          <td>${fecha}</td>
          <td><span class="badge badge-active">Activo</span></td>
        </tr>`;
    }).join('');
  }

  function filterTable() {
    const q = document.getElementById('search').value.toLowerCase();
    const filtered = allClients.filter(c =>
      (c.nombre||'').toLowerCase().includes(q) ||
      (c.email||'').toLowerCase().includes(q) ||
      (c.empresa||'').toLowerCase().includes(q)
    );
    renderTable(filtered);
  }
</script>
</body>
</html>
